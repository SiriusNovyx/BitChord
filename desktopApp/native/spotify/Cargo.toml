[package]
name = "bitchord-spotify"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
librespot-core = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-playback = { version = "=0.8.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
librespot-core = { path = "../../native-dependencies/spotify/librespot-core" }

[profile.release]
lto = "thin"
strip = true
panic = "abort"
